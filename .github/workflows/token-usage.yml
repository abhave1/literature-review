name: Token usage ledger
on:
  pull_request:
    paths:
      - 'lib/usage/**'
      - 'lib/asu-aiml-client.ts'
      - 'lib/auth/**'
      - 'app/api/analyze/**'
      - 'app/api/screening/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/token-usage.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: usage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:usage && npm run test:auth && npm run test:prompts
      - name: Migration and row access tests on disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: usage_test
        run: psql -v ON_ERROR_STOP=1 -f tests/usage-ledger.sql
